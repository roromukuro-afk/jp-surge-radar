name: Validate

# 単体テストのみ。本番DBには一切接続しない(旧版はpushのたびに本番Neonで
# track/train のスモークを走らせ、dry-run の記録で本番の実行記録を汚していた)。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pandas
      - run: python -m pytest -q tests/
