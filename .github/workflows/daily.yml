name: Daily Pipeline
on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max stocks (blank=all ~3000)"
        required: false
        default: ""
        type: string
      skip_materials:
        description: "Skip materials step (true/false)"
        required: false
        default: "false"
        type: string
jobs:
  daily:
    runs-on: ubuntu-latest
    # momentum pool(最大100銘柄)+top100継続enrich+全銘柄ローテーション巡回
    # (250銘柄/回)を追加。1銘柄あたりの実測所要時間にばらつきが大きく
    # (小規模ベンチマーク2.25秒 vs 実データ200銘柄で18秒/銘柄、原因未特定)、
    # 正確な見積りができていないため安全側の180分に設定。パブリックリポジトリ
    # (Actions分課金なし)なので余裕を持たせている(GitHub Actionsのホスト型
    # ランナーはジョブ単位で最大6時間=360分がハード上限、変更不可)。
    # 次回以降の実行結果(job_logs)を見て安全なら段階的に緩める。
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SURGE_ENABLE_LLM: "0"
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
      # 未設定なら空文字 → EDINET取得はスキップ(理由をログ出力)。
      # 無料キーを GitHub Secret に設定すると EDINET 材料が自動で入る。
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt
      - name: Install Playwright Chromium (Kabutan bot-check bypass)
        run: playwright install --with-deps chromium
      - name: Initialize DB schema
        run: python -m surge_radar.cli init-db
      - name: Run daily pipeline
        run: python scripts/run_daily.py "${{ inputs.limit }}" "${{ inputs.skip_materials }}"
      - name: Show logs on failure
        if: failure()
        run: python scripts/cloud_logs.py || true
      - name: Summary
        if: always()
        run: python scripts/cloud_summary.py || true
