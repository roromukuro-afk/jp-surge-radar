<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}日本株 急騰レーダー{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0b0f17">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      ink: '#0b0f17', panel: '#131a26', panel2: '#1b2433', line: '#26344a',
      acc: '#22d3ee', good: '#34d399', warn: '#fbbf24', bad: '#f87171'
    }}}}
  </script>
  <style>
    body{background:#0b0f17;color:#e5edf7;-webkit-text-size-adjust:100%}
    .card{background:#131a26;border:1px solid #26344a;border-radius:14px}
    .chip{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
    a{color:#67e8f9}
  </style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-20 backdrop-blur bg-ink/80 border-b border-line">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-2">
    <a href="/" class="font-bold text-white no-underline">📈 急騰レーダー</a>
    <nav class="ml-auto flex gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-lg no-underline {{ 'bg-panel2 text-white' if request.url.path=='/' else 'text-slate-300' }}">今日の候補</a>
      <a href="/history" class="px-3 py-1.5 rounded-lg no-underline {{ 'bg-panel2 text-white' if request.url.path=='/history' else 'text-slate-300' }}">成績</a>
    </nav>
  </div>
</header>
<main class="max-w-4xl mx-auto px-4 py-5">
{% block content %}{% endblock %}
</main>
<footer class="max-w-4xl mx-auto px-4 pb-8 text-xs text-slate-500">
  判定: 基準日の終値から、翌営業日以降10営業日以内の場中高値で+20%に届けば成功。
  候補はClaudeがチャート・出来高・材料を読んで選んだもので、投資助言ではありません。
</footer>
</body>
</html>
